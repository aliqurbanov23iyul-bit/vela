services:
  postgres:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: forex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set a private database password}
    ports: ["127.0.0.1:5432:5432"]
    volumes: ["postgres:/var/lib/postgresql"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d forex"]
      interval: 10s
      timeout: 5s
      retries: 10
  redis:
    image: redis:8
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: ["redis:/data"]
volumes:
  postgres:
  redis:
